openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /_api
    description: Expense tracker API
tags:
  - name: health
    description: Health operations
  - name: expenses
    description: Expense tracking
  - name: dashboard
    description: Spending summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Record an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /expenses/{expenseId}:
    parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          description: Expense not found
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      responses:
        "204":
          description: Deleted expense
        "404":
          description: Expense not found
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get monthly spending summary
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: Spending summary for the selected month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Expense:
      type: object
      required: [id, amount, description, category, date, payment_method, note, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
        description:
          type: string
        category:
          type: string
        date:
          type: string
          format: date
        payment_method:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
    ExpenseInput:
      type: object
      required: [amount, description, category, date]
      properties:
        amount:
          type: number
          minimum: 0.01
        description:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        payment_method:
          type: string
        note:
          type: string
    ExpenseUpdate:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        description:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        payment_method:
          type: string
        note:
          type: string
    DailySpend:
      type: object
      required: [date, total]
      properties:
        date:
          type: string
          format: date
        total:
          type: number
    CategorySpend:
      type: object
      required: [category, total]
      properties:
        category:
          type: string
        total:
          type: number
    DashboardSummary:
      type: object
      required: [month, total, previous_total, change_percent, transaction_count, daily_spend, category_spend]
      properties:
        month:
          type: string
        total:
          type: number
        previous_total:
          type: number
        change_percent:
          type: ["number", "null"]
        transaction_count:
          type: integer
        daily_spend:
          type: array
          items:
            $ref: "#/components/schemas/DailySpend"
        category_spend:
          type: array
          items:
            $ref: "#/components/schemas/CategorySpend"

